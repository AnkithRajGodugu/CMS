version: "3.9"

services:
  # =====================
  # PostgreSQL Database
  # =====================
  postgres:
    image: postgres:15
    container_name: cms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Hello@123!
      POSTGRES_DB: cms_db
    ports:
      - "0:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # =====================
  # pgAdmin (DB UI - optional)
  # =====================
  pgadmin:
    image: dpage/pgadmin4
    container_name: cms-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cms.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # =====================
  # Backend (Spring Boot)
  # =====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-backend
    restart: always
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
