apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  labels:
    app: backend
type: Opaque
stringData:
  # Database Credentials
  database.username: "postgres"
  database.password: "Hello@123!"
  
  # JWT Secret (Base64 encoded in production)
  jwt.secret: "mySecretKey12345678901234567890123456789012345678901234567890"
  
  # Encryption Key (Generate new key for production)
  encryption.key: ""
  
  # Note: In production, use kubectl create secret or external secret management
  # kubectl create secret generic backend-secrets \
  #   --from-literal=database.username=postgres \
  #   --from-literal=database.password=<strong-password> \
  #   --from-literal=jwt.secret=<generated-secret> \
  #   --from-literal=encryption.key=<generated-key>
