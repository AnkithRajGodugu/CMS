spring:
  sql:
    init:
      mode: never   # 🔥 THIS IS THE KEY FIX

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false


    cache:
      type: simple

cms:
  kafka:
    enabled: false

server:
  port: 0


