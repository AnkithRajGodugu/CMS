spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  sql:
    init:
      mode: never   # 🚨 IMPORTANT (prevents schema.sql conflicts)

  cache:
    type: simple

  # Disable real Redis & Kafka in tests
  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:29092

cms:
  kafka:
    enabled: false

server:
  port: 0

# Test-only JWT & encryption — safe placeholder values
jwt:
  secret: test-only-secret-key-that-is-at-least-64-characters-long-do-not-use-in-prod
  expiration: 86400000

encryption:
  key: dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE=

websocket:
  allowed-origins: http://localhost:3000