spring.application.name=CMS

# ===============================
# SERVER
# ===============================
server.port=8081

# Tell Spring Boot to read the .env file in the parent project directory
spring.config.import=optional:file:../.env[.properties]

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/cms_db}
spring.datasource.username=${DB_USER:postgres}
# In production always override DB_PASSWORD via env var; dev fallback below
spring.datasource.password=${DB_PASSWORD:Hello@123!}

# ===============================
# FLYWAY MIGRATIONS
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# JWT CONFIG
# ===============================
# In production always override JWT_SECRET via env var (min 64 chars).
# Dev fallback provided below — NEVER use this in production.
jwt.secret=${JWT_SECRET:cms-dev-only-secret-key-that-is-at-least-64-characters-long-change-in-prod}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# ENCRYPTION
# ===============================
# In production always override ENCRYPTION_KEY via env var.
# Dev fallback is a Base64 32-byte key — NEVER use this in production.
encryption.key=${ENCRYPTION_KEY:Y21zLWRldi1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE=}

# ===============================
# ACTUATOR
# ===============================
# Actuator — only expose safe endpoints; prometheus & metrics are auth-protected via SecurityConfig
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate=INFO

# ===============================
# CACHE
# ===============================
spring.cache.type=simple


# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Logging
logging.level.com.example=DEBUG

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# ===============================
# MAIL CONFIGURATION (Mailtrap / SMTP)
# ===============================
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Timeouts (ms) — prevent the mail thread from hanging on an unreachable server
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# APP SETTINGS
# ===============================
# Set to false to disable outbound mail entirely (console logging still shows URLs)
app.mail.enabled=${MAIL_ENABLED:true}
# Frontend base URL used for email links
app.frontend.url=${FRONTEND_URL:http://localhost:3001}