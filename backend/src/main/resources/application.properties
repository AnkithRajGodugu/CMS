spring.application.name=CMS

# ===============================
# SERVER
# ===============================
server.port=8082

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/cms_db
spring.datasource.username=postgres
spring.datasource.password=Hello@123!

# ===============================
# FLYWAY MIGRATIONS
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=mySuperSecretJwtKeyThatIsAtLeast64CharactersLongForHS256Algorithm
jwt.expiration=86400000

# ===============================
# ENCRYPTION
# ===============================
encryption.key=0uip6i0HH6xmSJR3oR8sZ+hK5PdrxnQjRq8L+58nFwo=

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate=INFO

# ===============================
# CACHE
# ===============================
spring.cache.type=simple


#debug=true
#logging.level.org.springframework=DEBUG
logging.level.org.flywaydb=DEBUG

