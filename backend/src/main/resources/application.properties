spring.application.name=CMS

# Disable Kafka to stop warnings
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Database connection (env first, fallback defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cms_db?ssl=true&sslmode=prefer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Hello@123!}

# Database TLS/SSL Configuration
# For production, use sslmode=require or sslmode=verify-full
# sslmode options: disable, allow, prefer, require, verify-ca, verify-full
spring.datasource.hikari.data-source-properties.ssl=${DB_SSL_ENABLED:true}
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:prefer}
spring.datasource.hikari.data-source-properties.sslrootcert=${DB_SSL_ROOT_CERT:}
spring.datasource.hikari.data-source-properties.sslcert=${DB_SSL_CERT:}
spring.datasource.hikari.data-source-properties.sslkey=${DB_SSL_KEY:}

# HikariCP Connection Pool Configuration
# Pool size: Optimal formula is (core_count * 2) + effective_spindle_count
# For typical deployment: 10 connections handles ~1000 concurrent users
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=CMS-HikariPool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION:60000}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Slow Query Logging
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=2000
logging.level.org.hibernate.SQL_SLOW=WARN

# Server - Fixed port (standardized to 8080)
server.port=8080

# Kafka Configuration - DISABLED for now
spring.kafka.enabled=false
# Use kafka:9092 in Docker, localhost:9092 for local dev
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=cms-group

# Kafka Topic Configuration
spring.kafka.topic.partitions=${KAFKA_TOPIC_PARTITIONS:3}
spring.kafka.topic.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:1}

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey12345678901234567890123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Field-Level Encryption Configuration
# Generate a new key using: EncryptionUtil.generateKeyString()
# Store this key securely in environment variables for production
encryption.key=${ENCRYPTION_KEY:}

# Security Headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Actuator Health Check Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.prometheus.metrics.export.enabled=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.validation=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.kafka=INFO
