# ================================================
# Production Profile — cms.ankithtech.xyz
# All secrets MUST come from environment variables.
# Never set fallback values here.
# ================================================

# ── Logging ──────────────────────────────────────
logging.level.root=WARN
logging.level.com.example=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
# Suppress per-second Kafka metadata WARN spam (UNKNOWN_TOPIC resolves once topic exists)
logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.org.apache.kafka.clients.consumer.internals=WARN

# ── JPA ──────────────────────────────────────────
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# ── Connection Pool (HikariCP) ───────────────────
# Render free tier: 3 connections max to save memory (~4MB each)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── Tomcat thread pool (reduces thread stack memory) ─────
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=50

# ── Memory-saving Spring features ─────────────────
spring.main.banner-mode=off
spring.jmx.enabled=false
spring.main.lazy-initialization=true

# ── Redis SSL (Upstash requires TLS) ─────────────
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000ms

# ── Kafka — Confluent Cloud (SASL_SSL) ───────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
kafka.api.key=${KAFKA_API_KEY}
kafka.api.secret=${KAFKA_API_SECRET}
spring.kafka.consumer.group-id=cms-prod-group
# Confluent Cloud uses replication factor 3 (min for multi-broker)
spring.kafka.topic.replication-factor=3
spring.kafka.topic.partitions=3

# ── File Upload ───────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Actuator (restrict for production) ──────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# ── WebSocket CORS ────────────────────────────────
websocket.allowed-origins=https://cms.ankithtech.xyz,https://www.cms.ankithtech.xyz,https://cms-one-dun.vercel.app,https://cms-frontend.vercel.app

# ── Mail ──────────────────────────────────────────
app.mail.enabled=${MAIL_ENABLED:true}
app.frontend.url=https://cms.ankithtech.xyz
