stages:
  - build
  - test
  - docker

# =========================
# 1. Build JAR with Maven
# =========================
build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
  cache:
    paths:
      - .m2/repository

# =========================
# 2. Run Tests with PostgreSQL
# =========================
test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""   # Required for Testcontainers
  script:
    - echo "⚡ Running tests with Testcontainers (Postgres)"
    - mvn test verify
  cache:
    paths:
      - .m2/repository
  coverage: '/Total.*?([0-9]{1,3})%/'

# =========================
# 3. Build & Push Docker Image
# =========================
docker-build:
  stage: docker
  image: docker:27.0.2
  services:
    - docker:dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" $CI_REGISTRY --password-stdin
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
